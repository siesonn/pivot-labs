<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; form-action 'none'; base-uri 'none'; object-src 'none'"><meta name="robots" content="noindex"><meta name="viewport" content="width=1200"><title>Source for the share preview image | Pivot Labs</title><link rel="stylesheet" href="../css/pivot-labs.css">
<!--
  This file is the source for pivot-labs-share-1200x630.png (1200 x 630 px), the picture that shows when a Pivot Labs link is shared on LinkedIn and other sites. It is not a page for visitors.
  To change the image: edit this file, then remake the PNG. The README section "Share previews" has the command.
-->
<style>
/* Fonts and colors come from assets/css/pivot-labs.css. Sizes are fixed in px because the output is a fixed-size picture. */
html,body{margin:0;width:1200px;height:630px;overflow:hidden}
body{display:flex;align-items:center;border-top:14px solid var(--navy);box-sizing:border-box;background:var(--ivory);color:var(--navy);font-family:var(--body)}
/* The seal is 400 px wide, with 10% of its width as clear space on every side, per the brand guide. */
.seal{flex:0 0 auto;margin-left:56px;padding:40px}
.seal img{display:block;width:400px;height:400px}
.text{flex:1;min-width:0;padding-right:72px}
h1{margin:0;font-family:var(--display);font-weight:700;font-size:96px;line-height:1.05;letter-spacing:-1.5px}
.tagline{margin:10px 0 0;font-family:var(--display);font-style:italic;font-size:40px;line-height:1.25;padding-top:18px;border-top:2px solid var(--mocha);display:inline-block}
.what{margin:34px 0 0;font-size:30px;line-height:1.35;color:var(--espresso);text-wrap:balance}
.url{margin:28px 0 0;font-size:26px;font-weight:700;letter-spacing:.4px;color:var(--teal)}
</style></head>
<body>
<div class="seal"><img src="pivot-labs-seal-800.webp" alt=""></div>
<div class="text">
  <h1>Pivot Labs</h1>
  <p class="tagline">Navigating Everyday Leadership</p>
  <p class="what">Free tools and visual guides for everyday leadership.</p>
  <p class="url">pivotlabsleadership.com</p>
</div>
</body></html>
