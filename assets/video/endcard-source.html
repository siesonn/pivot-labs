<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>Intro video end card (source)</title>
<!-- The seal already carries the tagline, so the card shows only the seal and the address. Source for the intro video's end card. Rendered at 1920 by 1080 in headless Chrome, then used as the last shot of the video. Not linked from the site. -->
<link rel="stylesheet" href="../css/pivot-labs.css">
<style>
html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:var(--navy)}
.card{width:1920px;height:1080px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;color:var(--ivory);text-align:center}
.card img{width:560px;height:560px;display:block}
.end-url{margin:56px 0 0;font:600 44px/1.2 var(--body);letter-spacing:.02em;color:var(--teal-tint)}
</style></head><body>
<div class="card">
  <img src="../img/pivot-labs-seal-800.webp" alt="Pivot Labs">
  <p class="end-url">pivotlabsleadership.com</p>
</div>
</body></html>
